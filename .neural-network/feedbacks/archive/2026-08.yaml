  summary: Freshly spawned dev agents inherited the orchestrator session's pinned
    worktree instead of their assigned lane, twice
  detail: Two consecutive dev agents were pinned by the launcher into whatever worktree
    the orchestrator session occupied (one got a sibling lane's worktree, one got
    the previous task's); both caught it — one via the Edit-tool isolation guard,
    one via a pwd check — flagged instead of proceeding, and self-recovered by re-pinning
    with the worktree-entry tool.
  generalized: 'Subagent working-directory pinning follows the spawning session''s
    cwd, not the brief: every agent brief that names a worktree must instruct the
    agent to verify pwd against the brief before its first write and re-pin itself
    if they disagree; the orchestrator must likewise remember that path-guarded tools
    and tree-fingerprint hooks evaluate ITS pinned tree, not the task''s.'
  routing:
    action: brain-note
    ref: orchestrator
- category: recommendation
  area: board
  severity: medium
  summary: The In-review move guard fingerprints the session's pinned tree, coupling
    unrelated lanes
  detail: Parking one task at In review was blocked because a DIFFERENT lane's worktree
    (where the orchestrator session is pinned) had work-in-progress; the move only
    succeeded once that unrelated tree went green again.
  generalized: A gate-fingerprint guard on board moves should evaluate the tree of
    the branch/task being moved (or accept an explicit tree argument), not the invoking
    session's current checkout — otherwise multi-lane orchestration serializes on
    whichever worktree the session happens to sit in.
  proposal:
    target: scripts/guard-board-move.sh + gate-preflight
    change: resolve the tree to fingerprint from the task's branch/worktree, or add
      --tree
  routing:
    action: backlog
    ref: Zugruul/development-skills#521
- category: worked-well
