invariants:
- One shared script/schema/template/test engine; no skill, script, or schema is forked
  into separate per-host copies.
- '`name` and `description` are the only frontmatter fields either host is assumed
  to enforce; `allowed-tools` remains a Claude-only enhancement, never the cross-host
  security boundary.'
- Plugin-root resolution never reads the current working directory.
- Critical safety enforcement (gate-before-review, checkpoint, truthful board state)
  is implemented in deterministic scripts/preflight checks, with hooks as defense
  in depth only — never the sole enforcement mechanism.
- Existing `.claude/project.yaml` consumers on schemaVersion 2 remain valid with zero
  required changes; any new field is additive and optional.
- Claude Code's existing installation, manifests, hooks, and slash-command invocation
  remain unchanged and functioning throughout.
- No unrelated pre-existing working-tree changes are reverted, overwritten, staged,
  or committed by this work.
- Degraded features are documented explicitly; none are silently faked or hidden.
