# yaml-language-server: $schema=https://raw.githubusercontent.com/Zugruul/development-skills/main/plugins/spec-workflow/schemas/project-config.schema.json#/properties/specs/items
id: peer
title: Peer review CLI providers; HTTP dispatch deferred (SPEC-PEER-REVIEW.md)
board: main
specPath: SPEC-PEER-REVIEW.md
backlogPath: docs/BACKLOG-PEER-REVIEW.md
taskPrefix: PRV
epics:
- id: E0
  title: /peer-review skill
  taskRanges:
  - - 1
    - 9
- id: E1
  title: Remote LLM dispatch (unimplemented, deferred historical proposal)
  taskRanges:
  - - 10
    - 19
invariants:
- A peer review does not modify reviewed files or apply findings -- Codex review uses
  --sandbox read-only; Claude uses --permission-mode plan. These flags constrain
  intended review edits, not network isolation; private temporary files are cleaned up.
- Secrets must not be committed to git. Authentication belongs to the user's CLI
  configuration; peer review adds no credential store or token-redaction guarantee.
  Provider errors and raw fallback output are forwarded.
- No persistent process, daemon, heartbeat, or background agent is installed on any
  machine by this work; everything runs synchronously at the moment of use.
- External transmission to OpenAI/Codex and Anthropic/Claude is disclosed, including
  possible repository context beyond the diff. The user's CLI configuration owns
  transport; the plugin enforces no destination allowlist.
- Provider registry entries and overrides are trusted executable configuration, not
  a security sandbox. SSH-machine registration grants no peer HTTP authority.
- External-model findings are always labeled with their source and never presented
  as, or silently merged into, the orchestrator's own judgment.
- Scripts are bash 3.2-compatible / stdlib-only Python, set -uo pipefail, shellcheck-clean.
