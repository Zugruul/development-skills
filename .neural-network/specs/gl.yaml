invariants:
- Brains remain orchestrator-mediated; no role reads another role's brain directory;
  subagents receive knowledge only as pasted brief text.
- No graphify, tree-sitter, embedding, or graph-library dependency is introduced;
  scripts stay bash 3.2-compatible and Python stdlib-only (PyYAML sole exception).
- Every new data file (e.g. outcomes.jsonl) degrades byte-identically — its absence
  reproduces pre-change behavior exactly, covered by a regression fixture.
- .activation.jsonl and brain-events.jsonl schemas are append-extended only; new event
  types allowed, existing fields never repurposed.
- Every brain-mutating command refuses or loudly warns when one invocation would remove
  more than a configured fraction of notes or links (shrink guard).
- No new artifact is written into prompt-cache-visible workspace paths; new outputs
  live in existing .claude/ locations or stdout.
- Red-first TDD — a failing-test commit precedes implementation; the gate is green
  before In review.
- Documentation covered by docs[] is updated in the same PR as the behavior it describes.
