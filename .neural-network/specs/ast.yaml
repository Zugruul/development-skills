invariants:
- LLM invocations occur only through locally authenticated subscription CLIs enabled
  as capabilities; no metered API is ever called.
- A disabled capability is never invoked by the engine, and harness subprocesses always
  run with pinned isolation and sandbox flags — the pair constitutes the boundary.
- Capability invocation is argv-array with schema-validated parameters; no invoke
  string is ever interpreted by a shell.
- The assistant repository contains no engine code and no dev-loop agent instructions.
- All brain writes are atomic and serialized (engine writer queue + cross-process
  flock in brain.py write paths).
- The assistant brain remains fully zettel-schema-compatible, including brain-events.jsonl
  emission.
- Conversation turns never block on the distiller, index refresh, or task queue.
- Transcripts, traces, tasks, and artifacts are never committed to git.
- Voice and chat are hard-gated off when no enabled assistant is selected.
- The engine's HTTP surface binds localhost only.
- A task executor never persists an artifact_path it did not itself construct — paths
  are built engine-side from the task's own id; nothing crossing the process boundary
  (job output, harness response, marker files) may supply one.
