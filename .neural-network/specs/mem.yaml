invariants:
- Notes are plain markdown + YAML frontmatter, OKF-compatible; no note content lives
  only in a database.
- Every derived layer (embedding index, folds, adjacency caches) is rebuildable from
  committed files + feeds alone.
- Feed appends are atomic single-line writes; no shared JSON file is read-modify-written
  on any concurrent path unless it is a derived cache.
- Role privacy holds — no role reads another role's brain; consult is the only cross-role
  path and is orchestrator-mediated.
- Superseded notes are never deleted and never injected.
- Core scripts remain stdlib-only; capability modules own their dependencies in isolated
  venvs and their absence degrades features, never breaks flows.
- Graduation and skill promotion remain verifier-gated, never model self-judgment.
- Additive-only — every new mechanism is opt-in, defaults preserve current behavior,
  and no existing flow breaks when a new component is absent or disabled.
