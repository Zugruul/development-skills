- category: incident
  area: testing
  component: plugins/spec-workflow/scripts/gate.sh
  severity: high
  summary: A long-lived deterministic environment bug masqueraded as flaky tests because
    the gate wrapper and the direct test runner had different environments
  detail: 'gate.sh exports PYTHONPATH; run-tests.sh direct does not. Every gate run
    red, every direct run green — misread as flakiness/concurrency for multiple sessions
    (#412), fixed as #437.'
  evidence:
  - Zugruul/development-skills#412
  - Zugruul/development-skills#437
  generalized: A gate wrapper must not export environment variables the underlying
    test runner does not itself set — any env divergence between the wrapper and the
    direct runner makes a deterministic bug look flaky, because red and green runs
    differ by invoker, not by code. Keep wrapper env additive-neutral or make the
    runner set the same env itself.
  proposal:
    target: plugins/spec-workflow/scripts/gate.sh
    change: Move any needed PYTHONPATH/env setup into run-tests.sh (or a shared env
      file both source) so wrapper and direct invocations are environment-identical;
      add a check that diffs the two envs.
  routing:
    action: backlog
    ref: Zugruul/development-skills#439
- category: friction
  area: testing
  severity: medium
  summary: Diagnosing a full-suite-only failure cost several ten-minute runs because
    there was no fast path to reproduce suite context for one section
  detail: Bisecting 113 sections at ~10 min per full run; the 30-second direct A/B
    (simulate the suspect env against the single failing command) is what actually
    cracked it.
  generalized: When a test fails only in full-suite context, prefer simulating the
    suspected contaminating condition directly against the failing command over bisecting
    the suite — a runner flag that replays one section under the accumulated env of
    a prior run would make this class of diagnosis minutes instead of hours.
  routing:
    action: backlog
    ref: Zugruul/development-skills#440
