- category: worked-well
  area: review
  severity: high
  summary: Reviews that demand experiment-confirmed findings caught severe defects
    a green gate missed, every round
  detail: Round-1 reviews caught a tokens-vs-chars unit error headed into spec text,
    a marker-file path-smuggling flow enabling cross-task artifact substitution, and
    a feature hidden in exactly the multi-assistant configuration the human runs;
    each was CONFIRMED by the reviewer driving the real code, and each fix round was
    then mutation-tested for pinning.
