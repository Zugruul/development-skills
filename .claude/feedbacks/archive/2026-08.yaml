    by driving the real code) versus PLAUSIBLE, and re-review rounds should mutation-test
    that new tests actually pin the fixes — this reliably catches defects that a green
    test suite and gate cannot.
  routing:
    action: brain-note
    ref: reviewer
- category: recommendation
  area: board
  severity: medium
  summary: Enforcement hooks demanding records that history lacks are best satisfied
    by doing the work retroactively, never by fabricating records
  detail: Two merged-but-board-stale tasks could not advance because review-pass records
    were never made; a real retroactive two-pass review against merged reality generated
    the records honestly and surfaced eight genuine follow-up bugs in the process.
  evidence:
  - Zugruul/development-skills#342
  - Zugruul/development-skills#343
  generalized: When a board-enforcement hook blocks a transition because required
    records are missing from history, run the required activity retroactively against
    merged reality and record the genuine result — the byproduct is usually a crop
    of real follow-up findings, and the board never lies.
  routing:
    action: brain-note
    ref: orchestrator
- category: incident
  area: testing
  severity: high
  summary: A scratch test server stopped a machine-global voice service on shutdown,
    taking down live user-facing functionality
  detail: A QA validator's state-scoped scratch server auto-started and then, on stop,
    killed the machine-global whisper STT sidecar; the user's voice input was down
    until the orchestrator restarted it.
  evidence:
  - Zugruul/development-skills#509
  generalized: State-scoped or scratch instances must never manage machine-global
    resources; lifecycle ownership must be scoped to the same state dir the instance
    owns, and validator/test briefs should require restoring any global service they
    may have disturbed before finishing.
  routing:
    action: brain-note
    ref: orchestrator
- category: recommendation
  area: concurrency
  severity: medium
  summary: Declined auto-merge consent plus serial delivery predictably freezes all
    lanes at the WIP limit; the loop should pivot to non-gated work
  detail: With merges human-gated, four lanes filled with In-review tasks and no picks
    were possible; the productive pivot was QA-to-Ready validation of merged tasks
    and mechanical enforcement checks, which advanced 15 board items while waiting.
  generalized: When merge consent is declined and lanes saturate at the WIP limit,
    the loop should pivot to advancing merged-but-unvalidated work (QA validation
    against acceptance criteria, enforcement verification) instead of idling on heartbeats
    — encode this pivot as the expected behavior in the loop skill.
  proposal:
    target: skills/build-next/SKILL.md
