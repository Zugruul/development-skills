name: ci

# The archived plugins (archived/) are validated only: their manifests and
# marketplace files are checked, their test suites are not run. To restore the
# suites, add these to the `test` job (spec-workflow's suite takes about 25 min):
#   - run: pip install --quiet pyyaml   # config loader + eval checks need it
#   - run: for t in archived/plugins/*/tests/run-tests.sh; do bash "$t"; done
#   - run: for c in archived/plugins/*/tests/check-evals.py; do python3 "$c"; done
# and add archived/plugins/... to the shellcheck globs.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install shellcheck 0.11.0 (pinned — ubuntu-latest's apt version is older and produces false SC2218/SC2015 findings)
        run: |
          curl -Lo /tmp/shellcheck.tar.xz "https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz"
          tar xf /tmp/shellcheck.tar.xz -C /tmp
          sudo cp /tmp/shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck

      - name: shellcheck
        # src/ helpers and bash stub binaries are linted on their own: -x does not report
        # warnings inside sourced files. nullglob drops patterns that match nothing.
        shell: bash
        run: |
          shopt -s nullglob
          files=(.github/scripts/*.sh plugins/*/scripts/*.sh plugins/*/scripts/lib/*.sh plugins/*/scripts/src/*.sh plugins/*/tests/*.sh)
          for f in plugins/*/tests/fixtures/stub-*/*; do head -1 "$f" | grep -q 'bash' && files+=("$f"); done
          shellcheck -x "${files[@]}"

      - name: plugin tests
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          for t in plugins/*/tests/run-tests.sh; do bash "$t"; done

  validate-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install claude code
        run: npm install -g @anthropic-ai/claude-code
      - name: validate marketplace + plugin manifests
        run: |
          claude plugin validate .
          claude plugin validate archived
          for p in plugins/*/ archived/plugins/*/; do claude plugin validate "$p"; done

  validate-codex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check both marketplaces (Claude and Codex manifests agree, sources resolve)
        run: bash .github/scripts/check-marketplaces.sh
